<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Cards Dinâmico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Meu Feed de Postagens</h1>
    <button id="theme-toggle">Alternar Modo Escuro</button>
  </header>

  <main class="container">
    <article class="card">
      <h2>Título da Postagem 1</h2>
      <p>Este é o conteúdo do primeiro card. Passe o mouse para ver o efeito de escala e sombra.</p>
    </article>

    <article class="card">
      <h2>Título da Postagem 2</h2>
      <p>Conteúdo da segunda postagem com transições e suporte a modo claro e escuro.</p>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
